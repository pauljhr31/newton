# NEWTON - local environment.
# Secrets come from the .env file (never committed). Create it with:
#   python infra/scripts/make_env.py
name: newton

x-db-admin-url: &db-admin-url postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/newton

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: newton
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d newton"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No port published: the database is reachable only from the other containers.

  # One-shot job: creates the restricted app role and applies migrations, then exits.
  migrate:
    build:
      context: apps/api
      target: runtime
    command: ["python", "-m", "newton.cli", "migrate"]
    environment:
      DATABASE_ADMIN_URL: *db-admin-url
      NEWTON_APP_DB_PASSWORD: ${NEWTON_APP_DB_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: apps/api
      target: runtime
    restart: unless-stopped
    environment:
      NEWTON_ENV: ${NEWTON_ENV:-development}
      # The API itself only knows the restricted role (subject to RLS).
      DATABASE_URL: postgresql+psycopg://newton_app:${NEWTON_APP_DB_PASSWORD:?}@db:5432/newton
      JWT_SECRET: ${JWT_SECRET:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # Admin commands (create a company, demo data). Not started by default.
  admin:
    profiles: ["tools"]
    build:
      context: apps/api
      target: runtime
    entrypoint: ["python", "-m", "newton.cli"]
    environment:
      NEWTON_ENV: ${NEWTON_ENV:-development}
      DATABASE_ADMIN_URL: *db-admin-url
      NEWTON_APP_DB_PASSWORD: ${NEWTON_APP_DB_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy

  # Automated tests against a separate database (newton_test). Not started by default.
  test:
    profiles: ["tools"]
    build:
      context: apps/api
      target: dev
    command: ["pytest", "-p", "no:cacheprovider"]
    environment:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/postgres
      NEWTON_APP_DB_PASSWORD: ${NEWTON_APP_DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    volumes:
      - ./apps/api/newton:/app/newton:ro
      - ./apps/api/tests:/app/tests:ro
      - ./apps/api/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
