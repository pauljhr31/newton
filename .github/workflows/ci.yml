name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_pw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin" --health-interval 3s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      # Throwaway values for the disposable CI database only.
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://ci_admin:ci_admin_pw@localhost:5432/postgres
      NEWTON_APP_DB_PASSWORD: ci_app_pw_throwaway
      JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-ci-throwaway-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -p no:cacheprovider

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          git /repo --redact --verbose
